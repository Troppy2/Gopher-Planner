[project]
name = "backend"
version = "0.1.0"
description = "Flask REST API for Gopher Planner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "google-auth>=2.62.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"